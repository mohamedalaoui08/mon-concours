<!-- =========================
     PAGE ABONNEMENTS
     ========================= -->
<div class="abonnement-page">

  <!-- =========================
       TITRE
       ========================= -->
  <div class="abonnement-header">
    <h1>Choisissez votre abonnement</h1>
    <p>
      Accédez à toutes les ressources dont vous avez besoin
      pour préparer vos concours.
    </p>
  </div>

  <!-- =========================
       OFFRES
       ========================= -->
  <div class="offres-container">

    <div
      *ngFor="let offre of offres"
      class="offre-card">

      <h2>{{ offre.nom }}</h2>

      <div class="prix">
        <span class="prix-valeur">{{ offre.prix }}</span>
        <span class="prix-devise">DH</span>
      </div>

      <p class="duree">
        {{ offre.dureeJours }} jours
      </p>

      <div class="separateur"></div>

      <p class="description">
        {{ offre.description }}
      </p>

      <button
        *ngIf="estConnecte"
        class="souscrire-button"
        (click)="souscrire(offre)">
        Souscrire
      </button>

      <a
        *ngIf="!estConnecte"
        routerLink="/connexion"
        class="connexion-button">
        Se connecter pour souscrire
      </a>

    </div>

  </div>

  <!-- =========================
       MESSAGE
       ========================= -->
  <p
    *ngIf="messageAbonnement"
    class="message-abonnement">
    {{ messageAbonnement }}
  </p>

</div>
